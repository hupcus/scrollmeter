name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref: a new push cancels the previous, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Unit tests, lint, debug + release build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The daemon JVM is pinned to 21 in gradle/gradle-daemon-jvm.properties; setup-java makes
      # Temurin 21 the current JVM, which satisfies that criterion without any download.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # No setup-android step: the ubuntu runner image ships the Android SDK (ANDROID_HOME) with
      # accepted licences, and android-actions/setup-android@v3 fails on the removed `tools` package.
      # assembleRelease: the R8 build users get (unsigned here — CI never holds the upload key) and
      # the release merged manifest for the policy check below.
      - name: Unit tests, lint, debug and release build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      # What the build ships, library contributions included: no forbidden permission, the service
      # exported=false behind BIND_ACCESSIBILITY_SERVICE, no debug FileProvider in release.
      - name: Merged manifest policy
        run: python3 tools/check_manifest_policy.py app/build/intermediates/merged_manifests/*/process*Manifest/AndroidManifest.xml

      # The APK itself: not debuggable, no code calls android.util.Log, no debug recording.
      - name: Release APK check
        run: |
          python3 tools/check_release_apk.py --apk app/build/outputs/apk/release/app-release-unsigned.apk \
            --mapping app/build/outputs/mapping/release/mapping.txt

      - name: Python tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
